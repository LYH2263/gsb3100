services:
  db:
    image: mysql:8.0
    container_name: warehouse-db
    restart: always
    environment:
      MYSQL_DATABASE: warehouse
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - warehouse-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: warehouse-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/warehouse?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8100:8100"
    depends_on:
      - db
    networks:
      - warehouse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: warehouse-frontend
    restart: always
    ports:
      - "3100:80"
    depends_on:
      - backend
    networks:
      - warehouse-network

networks:
  warehouse-network:
    driver: bridge

volumes:
  mysql_data:
